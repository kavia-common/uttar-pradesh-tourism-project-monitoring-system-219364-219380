# Server port selection:
# - If environment variable PORT is set, Spring will use it via property binding below.
# - Otherwise default to 3001 which matches the preview system expectation.
server.port=${PORT:3001}

spring.application.name=upstdc-backend

# Management endpoints exposure for basic liveness checks (health, info)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
