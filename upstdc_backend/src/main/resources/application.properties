# Server port fixed to 3001 for backend container
server.port=3001

spring.application.name=upstdc-backend

# Management endpoints exposure for liveness/readiness
management.endpoints.web.exposure.include=health,info,readiness,liveness
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Database configuration from environment variables (with sensible defaults)
# The orchestrator should set: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST:upstdc_database}:${DB_PORT:5000}/${DB_NAME:upstdc}
spring.datasource.username=${DB_USER:upstdc}
spring.datasource.password=${DB_PASSWORD:upstdc}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate (kept conservative; can be adjusted per schema management policy)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
