# Server port fixed to 3001 for backend container
server.port=3001

spring.application.name=upstdc-backend

# Management endpoints exposure for liveness/readiness
management.endpoints.web.exposure.include=health,info,readiness,liveness
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Default to stub/no-db mode by disabling datasource auto-configuration
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Profile notes:
# - default: stub (no DB), serves mocked data
# - h2: enable in-memory H2 database if needed for future development
# To use H2: run with --spring.profiles.active=h2

